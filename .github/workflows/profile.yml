name: Perfil · Datos públicos

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * *"
  push:
    branches: [main]
    paths:
      - scripts/profile/render_readme.mjs
      - scripts/profile/update_snapshot.py
      - scripts/profile/collect.py
      - .github/workflows/profile.yml
  pull_request:
    paths:
      - README.md
      - scripts/profile/render_readme.mjs
      - scripts/profile/update_snapshot.py
      - scripts/profile/collect.py
      - tests/**
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar privacidad y consistencia del calendario
        run: python3 -m unittest discover -s tests -v
      - name: Comprobar contenido dinámico del README
        run: node scripts/profile/render_readme.mjs --check

  refresh:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Actualizar datos públicos verificados
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.profile.update_snapshot
      - name: Generar métricas en Markdown
        run: node scripts/profile/render_readme.mjs
      - name: Validar resultados
        run: |
          python3 -m unittest discover -s tests -v
          node scripts/profile/render_readme.mjs --check
      - name: Publicar cambios
        run: |
          git add README.md profile/data.json
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): update verified public activity'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'Unable to publish after retries'
          exit 1
