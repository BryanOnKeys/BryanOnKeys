<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 413" role="img" aria-label="Calidad técnica con pruebas CI y arquitectura documentada"><title>Calidad técnica con pruebas CI y arquitectura documentada</title><defs><linearGradient id="bar"><stop stop-color="#fbfeff"/><stop offset=".45" stop-color="#b8cbe1"/><stop offset="1" stop-color="#f6faff" stop-opacity="0"/></linearGradient><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1b2735"/><stop offset=".65" stop-color="#0e141c"/><stop offset="1" stop-color="#0d1117"/></linearGradient><linearGradient id="pearl" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".38" stop-color="#bdd3e8"/><stop offset=".72" stop-color="#f4faff"/><stop offset="1" stop-color="#718eac"/></linearGradient><linearGradient id="silverline"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity=".65"/><stop offset=".7" stop-color="#9fbddf" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f6f9ff}.mono{font-family:Consolas,Menlo,monospace}.pulse{animation:pl 5s ease-in-out infinite}@keyframes pl{50%{opacity:.38}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="413" rx="18" fill="url(#bg)"/><text x="35" y="55" font-size="30" font-weight="750" fill="#f9fcff" style="fill:#f9fcff" >CALIDAD EN CADA CAMBIO</text><text x="35" y="88" font-size="16" font-weight="400" fill="#9cacc0" style="fill:#9cacc0" >Buenas prácticas aplicadas en repositorios públicos y verificables</text><rect x="30" y="127" width="373" height="207" rx="12" fill="#1d2936" stroke="#354354" /><text x="53" y="159" font-size="14" font-weight="600" fill="#aebed0" style="fill:#aebed0" class="mono">01 / PRUEBAS</text><text x="53" y="214" font-size="23" font-weight="650" fill="#f9fcff" style="fill:#f9fcff" >Automatización y comprobación</text><text x="53" y="250" font-size="15" font-weight="400" fill="#9cacc0" style="fill:#9cacc0" >Casos normales, errores y límites</text><rect x="53" y="286" width="101" height="3" rx="1.5" fill="url(#pearl)"/><rect x="421" y="127" width="373" height="207" rx="12" fill="#1d2936" stroke="#354354" /><text x="444" y="159" font-size="14" font-weight="600" fill="#aebed0" style="fill:#aebed0" class="mono">02 / CI</text><text x="444" y="214" font-size="23" font-weight="650" fill="#f9fcff" style="fill:#f9fcff" >Integración continua</text><text x="444" y="250" font-size="15" font-weight="400" fill="#9cacc0" style="fill:#9cacc0" >Revisión de cambios antes de unir</text><rect x="444" y="286" width="101" height="3" rx="1.5" fill="url(#pearl)"/><rect x="812" y="127" width="373" height="207" rx="12" fill="#1d2936" stroke="#354354" /><text x="835" y="159" font-size="14" font-weight="600" fill="#aebed0" style="fill:#aebed0" class="mono">03 / DISEÑO</text><text x="835" y="214" font-size="23" font-weight="650" fill="#f9fcff" style="fill:#f9fcff" >Arquitectura documentada</text><text x="835" y="250" font-size="15" font-weight="400" fill="#9cacc0" style="fill:#9cacc0" >Decisiones y responsabilidades</text><rect x="835" y="286" width="101" height="3" rx="1.5" fill="url(#pearl)"/><text x="35" y="385" font-size="16" font-weight="400" fill="#8d9fb2" style="fill:#8d9fb2" >Código, pipelines y documentos enlazados debajo de esta tarjeta.</text></svg>
