<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Identificador animado BK con halo multicolor"><title>Identificador animado BK con halo multicolor</title><defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#15202a"/><stop offset=".7" stop-color="#0d1117"/><stop offset="1" stop-color="#0c1017"/></linearGradient><linearGradient id="line"><stop stop-color="#f90001"/><stop offset=".5" stop-color="#f90001" stop-opacity=".5"/><stop offset="1" stop-color="#f90001" stop-opacity="0"/></linearGradient><radialGradient id="halo"><stop stop-color="#f90001" stop-opacity=".34"/><stop offset="1" stop-color="#f90001" stop-opacity="0"/></radialGradient><filter id="glow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes beam{0%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(50px)}100%{opacity:.25;transform:translateX(0)}}@keyframes pulse{50%{opacity:.38}}@keyframes spin{100%{transform:rotate(360deg)}}@keyframes scan{100%{transform:translateX(1030px)}}.pulse{animation:pulse 4.6s ease-in-out infinite}.spin{animation:spin 25s linear infinite;transform-origin:100px 100px}.scan{animation:scan 12s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="100" cy="100" r="92" fill="url(#halo)"/><circle class="spin" cx="100" cy="100" r="89" fill="none" stroke="#f90001" stroke-width="4" stroke-dasharray="32 9" opacity=".8"/><circle class="pulse" cx="100" cy="100" r="80" fill="none" stroke="#ff652f" stroke-width="2" stroke-dasharray="none" opacity=".8"/><circle class="spin" cx="100" cy="100" r="71" fill="none" stroke="#bd7af2" stroke-width="2" stroke-dasharray="32 9" opacity=".8"/><circle class="pulse" cx="100" cy="100" r="62" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="none" opacity=".8"/><circle cx="100" cy="100" r="61" fill="#ff9b69"/><circle cx="100" cy="100" r="48" fill="#0d1117"/><text x="100" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="49" font-weight="800" fill="#f1f5fa" text-anchor="middle">BK</text><circle cx="147" cy="147" r="6" fill="#39d353"/></svg>
