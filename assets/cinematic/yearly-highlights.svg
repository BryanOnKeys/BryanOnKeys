<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-label="Evolución anual basada solo en el calendario disponible"><title>Evolución anual basada solo en el calendario disponible</title><defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#15202a"/><stop offset=".7" stop-color="#0d1117"/><stop offset="1" stop-color="#0c1017"/></linearGradient><linearGradient id="line"><stop stop-color="#f90001"/><stop offset=".5" stop-color="#f90001" stop-opacity=".5"/><stop offset="1" stop-color="#f90001" stop-opacity="0"/></linearGradient><radialGradient id="halo"><stop stop-color="#f90001" stop-opacity=".34"/><stop offset="1" stop-color="#f90001" stop-opacity="0"/></radialGradient><filter id="glow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes beam{0%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(50px)}100%{opacity:.25;transform:translateX(0)}}@keyframes pulse{50%{opacity:.38}}@keyframes spin{100%{transform:rotate(360deg)}}@keyframes scan{100%{transform:translateX(1030px)}}.pulse{animation:pulse 4.6s ease-in-out infinite}.spin{animation:spin 25s linear infinite;transform-origin:100px 100px}.scan{animation:scan 12s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="495" rx="14" fill="url(#bg)"/><text x="35" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#39d353" font-family="Consolas,monospace" letter-spacing="1.7" >// VERIFIED WINDOW: 2025-10-26 — 2026-10-28</text><text x="35" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#f1f5fa" >Progress, not invented history.</text><rect x="35" y="130" width="554" height="293" rx="15" fill="#0e141c" stroke="#37404b" /><rect x="35" y="130" width="554" height="5" rx="2" fill="#bd7af2" stroke="#bd7af2" /><text x="63" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="67" font-weight="800" fill="#bd7af2" >2025</text><text x="63" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#f1f5fa" >Primera etapa</text><text x="63" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#f1f5fa" >0 contribuciones · 0 días activos</text><text x="63" y="328" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9aa7b7" >2025-10-26  –  2025-12-31</text><path d="M63 347L561 347" stroke="#323b49" stroke-width="1" fill="none" /><text x="63" y="382" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#9aa7b7" font-family="Consolas,monospace" letter-spacing="1.7" >PERIODO PARCIAL DEL CALENDARIO</text><rect x="614" y="130" width="554" height="293" rx="15" fill="#0e141c" stroke="#37404b" /><rect x="614" y="130" width="554" height="5" rx="2" fill="#ff652f" stroke="#ff652f" /><text x="642" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="67" font-weight="800" fill="#ff652f" >2026</text><text x="642" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#f1f5fa" >Proyectos y contribuciones</text><text x="642" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#f1f5fa" >44 contribuciones · 6 días activos</text><text x="642" y="328" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9aa7b7" >2026-01-01  –  2026-10-28</text><path d="M642 347L1140 347" stroke="#323b49" stroke-width="1" fill="none" /><text x="642" y="382" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#9aa7b7" font-family="Consolas,monospace" letter-spacing="1.7" >PERIODO PARCIAL DEL CALENDARIO</text><text x="35" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9aa7b7" >Los valores son