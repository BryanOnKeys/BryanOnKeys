<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Borough &amp; Ledger</title><desc id="desc">Una aplicación Full Stack para gestión comercial. Interfaces React conectadas con servicios Java y persistencia relacional en MySQL. Java Spring Boot React TypeScript MySQL</desc><defs>
