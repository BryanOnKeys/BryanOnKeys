<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">NEXO Fulfillment</title><desc id="desc">Pedidos, inventario y despachos en tiempo real. Una reserva transaccional conecta tres servicios con documentos PDF y notificaciones. NestJS TypeScript PostgreSQL Docker AWS</desc><defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#19212b"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#b6c6d8"/><stop offset=".52" stop-color="#fff"/><stop offset=".75" stop-color="#c8d9eb"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="line"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#eff8ff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sheen"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#f1f7ff" stop-opacity=".22"/><stop offset="1" stop-color="#d6e8ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:Segoe UI,Arial,Helvetica,sans-serif;fill:#f6f9ff}
.mono{font-family:ui-monospace,Consolas,Liberation Mono,monospace}
.pulse{animation:pulse 5s ease-in-out infinite}
.orbit{transform-origin:center;animation:orbit 28s linear infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="1200" height="340" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="url(#surface)" stroke="#303a48" /><ellipse cx="1060" cy="160" rx="230" ry="210" fill="url(#halo)"/><text x="32" y="37" font-size="12" font-weight="400" style="fill:#a4adbb" class="mono" letter-spacing="2">01 / OPERACIONES CONECTADAS</text><text x="32" y="96" font-size="40" font-weight="650" style="fill:#f6f9ff" class="" >NEXO Fulfillment</text><text x="32" y="141" font-size="20" font-weight="400" style="fill:#a4adbb" class="" >Pedidos, inventario y despachos en tiempo real.</text><text x="32" y="168" font-size="20" font-weight="400" style="fill:#a4adbb" class="" >Una reserva transaccional conecta tres servicios</text><text x="32" y="195" font-size="20" font-weight="400" style="fill:#a4adbb" class="" >con documentos PDF y notificaciones.</text><rect x="32" y="228" width="85.67999999999999" height="33" rx="16" fill="#171f2a" stroke="#3b4758" /><text x="74.84" y="250" font-size="16" font-weight="500" style="fill:#dbe5f2" text-anchor="middle" class="" >NestJS</text><rect x="127.67999999999999" y="228" width="122.8" height="33" rx="16" fill="#171f2a" stroke="#3b4758" /><text x="189.07999999999998" y="250" font-size="16" font-weight="500" style="fill:#dbe5f2" text-anchor="middle" class="" >TypeScript</text><rect x="260.48" y="228" width="122.8" height="33" rx="16" fill="#171f2a" stroke="#3b4758" /><text x="321.88" y="250" font-size="16" font-weight="500" style="fill:#dbe5f2" text-anchor="middle" class="" >PostgreSQL</text><rect x="393.28000000000003" y="228" width="85.67999999999999" height="33" rx="16" fill="#171f2a" stroke="#3b4758" /><text x="436.12" y="250" font-size="16" font-weight="500" style="fill:#dbe5f2" text-anchor="middle" class="" >Docker</text><rect x="488.96000000000004" y="228" width="57.839999999999996" height="33" rx="16" fill="#171f2a" stroke="#3b4758" /><text x="517.88" y="250" font-size="16" font-weight="500" style="fill:#dbe5f