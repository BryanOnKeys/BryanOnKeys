<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-labelledby="title desc"><title id="title">Stack tecnológico</title><desc id="desc">Stack tecnológico</desc><defs>
