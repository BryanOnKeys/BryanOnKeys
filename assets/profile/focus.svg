</style><rect width="1200" height="250" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="389" height="249" rx="18" fill="url(#surface)" stroke="#303a48" /><text x="24" y="35" font-size="11" font-weight="400" style="fill:#a4adbb" class="mono" letter-spacing="2">ENFOQUE / 01</text><text x="24" y="85" font-size="25" font-weight="600" style="fill:#f6f9ff" class="" >Backend y arquitectura</text><text x="24" y="130" font-size="15" font-weight="400" style="fill:#a4adbb" class="" >DDD, APIs REST y microservicios.</text><text x="24" y="159" font-size="15" font-weight="400" style="fill:#a4adbb" class="" >Concurrencia, idempotencia y eventos.</text><path d="M24 187H365" stroke="#303a48" /><text x="24" y="221" font-size="10" font-weight="400" style="fill:#c7d8eb" class="mono" >NEXO · NESTJS / POSTGRESQL</text><rect x="405.5" y="0.5" width="389" height="249" rx="18" fill="url(#surface)" stroke="#303a48" /><text x="429" y="35" font-size="11" font-weight="400" style="fill:#a4adbb" class="mono" letter-spacing="2">ENFOQUE / 02</text><text x="429" y="85" font-size="25" font-weight="600" style="fill:#f6f9ff" class="" >Calidad de principio a fin</text><text x="429" y="130" font-size="15" font-weight="400" style="fill:#a4adbb" class="" >Pruebas, permisos y errores comprensibles.</text><text x="429" y="159" font-size="15" font-weight="400" style="fill:#a4adbb" class="" >Docker y automatización con GitHub Actions.</text><path d="M429 187H770" stroke="#303a48" /><text x="429" y="221" font-size="10" font-weight="400" style="fill:#c7d8eb" class="mono" >TESTING / CI / DOCUMENTACIÓN</text><rect x="810.5" y="0.5" width="389" height="249" rx="18" fill="url(#surface)" stroke="#303a48" /><text x="834" y="35" font-size="11" font-weight="400" style="fill:#a4adbb" class="mono" letter-spacing="2">ENFOQUE / 03</text><text x="834" y="85" font-size="25" font-weight="600" style="fill:#f6f9ff" class="" >Seguir aprendiendo</text><text x="834" y="130" font-size="15" font-weight="400" style="fill:#a4adbb"