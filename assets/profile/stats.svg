<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="225" viewBox="0 0 1200 225" role="img" aria-labelledby="title desc"><title id="title">GitHub en cifras · datos públicos</title><desc id="desc">GitHub en cifras · datos públicos</desc><defs>
