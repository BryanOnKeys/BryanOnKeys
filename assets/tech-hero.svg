<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="BryanOnKeys — Full Stack Developer. Panel tecnológico moderno con capas de frontend, API y datos.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070e1f"/><stop offset=".55" stop-color="#111633"/><stop offset="1" stop-color="#17142e"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32e5cb"/><stop offset=".48" stop-color="#6db9ff"/><stop offset="1" stop-color="#b18dff"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7959ff" stop-opacity=".32"/><stop offset="1" stop-color="#7959ff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="27" height="27" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#54729b" opacity=".2"/></pattern>
</defs>
<style>
.h{font-family:Segoe UI,Inter,Arial,sans-serif;font-weight:800}
.m{font-family:Consolas,'Liberation Mono',monospace}
.line{animation:dash 7s linear infinite;stroke-dasharray:6 9}
.pulse{animation:light 3s ease-in-out infinite}
.float{animation:bob 6s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-150}}
@keyframes light{50%{opacity:.32}}
@keyframes bob{50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.line,.pulse,.float{animation:none}}
</style>
